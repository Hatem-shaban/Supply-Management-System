<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes orbit {
      0% { transform: rotate(0deg) translate(0, 0); }
      100% { transform: rotate(360deg) translate(0, 0); }
    }
    @keyframes data-flow {
      0% { stroke-dashoffset: 24; opacity: 0.2; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes progress-fill {
      0%, 100% { stroke-dasharray: 0 88; }
      50% { stroke-dasharray: 66 88; }
    }
    @keyframes light-sweep {
      0% { transform: translateX(-40px) skewX(-25deg); }
      20% { transform: translateX(60px) skewX(-25deg); }
      100% { transform: translateX(60px) skewX(-25deg); }
    }
    @keyframes node-pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes emblem-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1px); }
    }

    .orbit-container { transform-origin: 32px 32px; animation: orbit 12s linear infinite; }
    .orbit-container-reverse { transform-origin: 32px 32px; animation: orbit 16s linear reverse infinite; }
    .flow-line { stroke-dasharray: 4 20; animation: data-flow 3s linear infinite; }
    .progress-ring { stroke-dasharray: 0 88; animation: progress-fill 4s ease-in-out infinite; }
    .sweep-overlay { animation: light-sweep 4s ease-in-out infinite; }
    .node { animation: node-pulse 2s ease-in-out infinite; transform-origin: center; }
    .emblem-group { animation: emblem-float 4s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="grad_royal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="grad_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="grad_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="grad_indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="grad_navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="light_sweep_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="50%" stop-color="white" stop-opacity="0.3" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <clipPath id="emblem-clip">
      <path d="M32 20 L42 26 L42 38 L32 44 L22 38 L22 26 Z" />
    </clipPath>
  </defs>

  <!-- Background Motif -->
  <path d="M32 6 L56 20 L56 44 L32 58 L8 44 L8 20 Z" stroke="#E2E8F0" stroke-width="0.5" stroke-opacity="0.1" fill="none" />

  <!-- Orbiting Connections & Nodes -->
  <g class="orbit-container">
    <line x1="32" y1="32" x2="54" y2="20" stroke="url(#grad_cyan)" stroke-width="1" class="flow-line" style="animation-delay: 0s;" />
    <circle cx="54" cy="20" r="3.5" fill="url(#grad_cyan)" class="node" style="animation-delay: 0s;" />
    
    <line x1="32" y1="32" x2="10" y2="44" stroke="url(#grad_amber)" stroke-width="1" class="flow-line" style="animation-delay: 1.5s;" />
    <circle cx="10" cy="44" r="3" fill="url(#grad_amber)" class="node" style="animation-delay: 1.5s;" />
  </g>

  <g class="orbit-container-reverse">
    <line x1="32" y1="32" x2="50" y2="50" stroke="url(#grad_emerald)" stroke-width="1" class="flow-line" style="animation-delay: 0.75s;" />
    <circle cx="50" cy="50" r="3" fill="url(#grad_emerald)" class="node" style="animation-delay: 0.75s;" />
    
    <line x1="32" y1="32" x2="14" y2="14" stroke="url(#grad_indigo)" stroke-width="1" class="flow-line" style="animation-delay: 2.25s;" />
    <circle cx="14" cy="14" r="3.5" fill="url(#grad_indigo)" class="node" style="animation-delay: 2.25s;" />
  </g>

  <!-- Central Emblem -->
  <g class="emblem-group">
    <circle cx="32" cy="32" r="16" stroke="url(#grad_navy)" stroke-width="2.5" fill="none" opacity="0.1" />
    <path d="M32 16 A16 16 0 1 1 31.9 16" stroke="url(#grad_royal)" stroke-width="2.5" fill="none" stroke-linecap="round" class="progress-ring" />
    
    <path d="M32 20 L42 26 L42 38 L32 44 L22 38 L22 26 Z" fill="url(#grad_royal)" />
    <path d="M32 24 L38 27.5 L38 36.5 L32 40 L26 36.5 L26 27.5 Z" fill="white" fill-opacity="0.15" />
    
    <!-- Light Sweep Overlay -->
    <rect x="0" y="0" width="64" height="64" fill="url(#light_sweep_grad)" class="sweep-overlay" clip-path="url(#emblem-clip)" />
  </g>
</svg>
