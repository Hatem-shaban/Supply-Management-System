<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes materiaFlow {
        0% {
          opacity: 1;
          transform: translateY(-30px);
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(20px);
        }
      }
      
      @keyframes truckSettle {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(2px);
        }
      }
      
      @keyframes conveyorMove {
        0%, 100% {
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dashoffset: 4;
        }
      }
      
      .material-particle {
        animation: materiaFlow 1.5s ease-in-out infinite;
      }
      
      .material-particle-1 {
        animation-delay: 0s;
      }
      
      .material-particle-2 {
        animation-delay: 0.3s;
      }
      
      .material-particle-3 {
        animation-delay: 0.6s;
      }
      
      .material-particle-4 {
        animation-delay: 0.9s;
      }
      
      .material-particle-5 {
        animation-delay: 1.2s;
      }
      
      .truck-body {
        animation: truckSettle 2s ease-in-out infinite;
      }
      
      .conveyor-line {
        animation: conveyorMove 1.5s linear infinite;
      }
    </style>
  </defs>
  
  <!-- Background circle for header context -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.2"/>
  
  <!-- Conveyor/Loading System -->
  <g id="conveyor-system">
    <!-- Loading chute/hopper -->
    <path d="M 35 15 L 45 35 L 55 35 L 45 15 Z" fill="#2563eb" opacity="0.8"/>
    
    <!-- Conveyor belt line (animated) -->
    <line x1="35" y1="15" x2="50" y2="38" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2" class="conveyor-line"/>
    
    <!-- Chute support -->
    <line x1="35" y1="15" x2="32" y2="30" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="45" y1="15" x2="48" y2="30" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Material Particles (falling into truck) -->
  <g id="material-particles">
    <!-- Particle 1 -->
    <circle cx="42" cy="30" r="3" fill="#2563eb" class="material-particle material-particle-1" opacity="0.9"/>
    
    <!-- Particle 2 -->
    <circle cx="48" cy="28" r="2.5" fill="#2563eb" class="material-particle material-particle-2" opacity="0.85"/>
    
    <!-- Particle 3 -->
    <circle cx="45" cy="32" r="2" fill="#2563eb" class="material-particle material-particle-3" opacity="0.8"/>
    
    <!-- Particle 4 -->
    <circle cx="40" cy="29" r="2.5" fill="#2563eb" class="material-particle material-particle-4" opacity="0.75"/>
    
    <!-- Particle 5 -->
    <circle cx="50" cy="31" r="2" fill="#2563eb" class="material-particle material-particle-5" opacity="0.7"/>
  </g>
  
  <!-- Truck Body (with settling animation) -->
  <g id="truck" class="truck-body">
    <!-- Truck Cabin -->
    <rect x="25" y="50" width="18" height="15" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    
    <!-- Cabin window -->
    <rect x="28" y="52" width="8" height="6" rx="1" fill="#1e293b" opacity="0.3"/>
    
    <!-- Cabin door line -->
    <line x1="34" y1="50" x2="34" y2="65" stroke="#2563eb" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Truck Bed (main cargo area) -->
    <path d="M 43 55 L 85 55 L 88 62 L 43 62 Z" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    
    <!-- Truck bed side walls -->
    <line x1="43" y1="55" x2="41" y2="62" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="88" y1="62" x2="90" y2="62" stroke="#2563eb" stroke-width="1.5"/>
    
    <!-- Truck bed interior grid (cargo texture) -->
    <line x1="50" y1="55" x2="48" y2="62" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="60" y1="55" x2="58" y2="62" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="70" y1="55" x2="68" y2="62" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="80" y1="55" x2="78" y2="62" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Material in truck bed (accumulating) -->
    <ellipse cx="65" cy="60" rx="18" ry="2" fill="#2563eb" opacity="0.4"/>
    <path d="M 48 61 L 82 61 L 80 62 L 50 62 Z" fill="#2563eb" opacity="0.6"/>
    
    <!-- Front wheel -->
    <circle cx="35" cy="68" r="5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="35" cy="68" r="3" fill="none" stroke="#2563eb" stroke-width="1"/>
    
    <!-- Rear wheel 1 -->
    <circle cx="75" cy="68" r="5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="75" cy="68" r="3" fill="none" stroke="#2563eb" stroke-width="1"/>
    
    <!-- Rear wheel 2 -->
    <circle cx="85" cy="68" r="5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="85" cy="68" r="3" fill="none" stroke="#2563eb" stroke-width="1"/>
    
    <!-- Axle lines -->
    <line x1="30" y1="68" x2="90" y2="68" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- Loading Progress Indicator (subtle) -->
  <g id="progress-indicator">
    <!-- Progress bar background -->
    <rect x="25" y="78" width="60" height="2" rx="1" fill="#2563eb" opacity="0.2"/>
    
    <!-- Animated progress fill -->
    <defs>
      <style>
        @keyframes progressFill {
          0%, 100% {
            stroke-dashoffset: 60;
          }
          50% {
            stroke-dashoffset: 0;
          }
        }
        .progress-bar {
          animation: progressFill 2s ease-in-out infinite;
        }
      </style>
    </defs>
    <rect x="25" y="78" width="60" height="2" rx="1" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="60,60" class="progress-bar"/>
  </g>
  
  <!-- Loading text indicator (optional) -->
  <text x="60" y="100" font-size="10" font-weight="600" text-anchor="middle" fill="#2563eb" opacity="0.7">
    <tspan>Loading</tspan>
  </text>
  
  <!-- Subtle glow effect -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#2563eb" stroke-width="0.5" opacity="0.1" filter="url(#glow)"/>
</svg>
